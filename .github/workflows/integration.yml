name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  mars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Mars scaffold pipeline
        run: go test -tags integration -timeout 120s ./...
