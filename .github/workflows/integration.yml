name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test all template scaffold pipelines
        run: go test -tags integration -timeout 300s ./...
