name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Integration
        run: go test -tags integration -timeout 300s ./...

      - name: Prepare curated changelog entry
        run: |
          tag="${GITHUB_REF_NAME#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          python3 - "$tag" CHANGELOG.md > "$notes_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag, path = sys.argv[1:]
          text = Path(path).read_text()
          headings = list(re.finditer(r"^## \[(?:v)?([^]]+)\].*$", text, re.MULTILINE))
          for index, heading in enumerate(headings):
              if heading.group(1) == tag:
                  start = heading.end() + 1
                  end = headings[index + 1].start() if index + 1 < len(headings) else len(text)
                  notes = text[start:end].strip()
                  if not notes:
                      raise SystemExit(f"No release notes found for v{tag}")
                  print(notes)
                  break
          else:
              raise SystemExit(f"No changelog section found for v{tag}")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title="${GITHUB_REF_NAME#v}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
